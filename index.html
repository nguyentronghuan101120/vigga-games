<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vigga Mini-Games Portal</title>
  <link rel="stylesheet" href="shared/css/shell.css">
  <style>
    body {
      overflow: auto;
      min-height: 100vh;
      background: #f8fafc;
    }
    .portal-container {
      max-width: 800px;
      margin: 0 auto;
      padding: 40px 20px;
    }
    .portal-header {
      text-align: center;
      margin-bottom: 32px;
    }
    .portal-title {
      font-size: 2rem;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 8px;
    }
    .portal-subtitle {
      font-size: 1rem;
      color: var(--text-muted);
    }
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
    }
    .game-card {
      background: var(--surface-color);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s ease;
    }
    .game-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
      border-color: var(--primary);
    }
    .game-card-icon {
      font-size: 2.2rem;
    }
    .game-card-title {
      font-size: 1.15rem;
      font-weight: 700;
    }
    .game-card-desc {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.4;
    }
    .game-card-badge {
      align-self: flex-start;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 12px;
      background: #dbeafe;
      color: #1e40af;
    }
  </style>
</head>
<body>
  <header class="shell-header">
    <div class="shell-header-left">
      <a id="btn-hub" class="shell-btn" href="https://vigga.netlify.app/">
        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
        <span>Về Game Hub</span>
      </a>
    </div>
    <div class="shell-header-center">
      <span>Vigga Games</span>
    </div>
    <div class="shell-header-right">
      <button id="btn-sound" class="shell-btn icon-only" title="Bật/Tắt âm thanh"></button>
    </div>
  </header>

  <main class="portal-container">
    <div class="portal-header">
      <h1 class="portal-title">Kho Mini-Games Trí Tuệ</h1>
      <p class="portal-subtitle">Trò chơi siêu nhẹ, mượt mà trên mọi thiết bị</p>
    </div>

    <div class="games-grid">
      <a href="games/caro/" class="game-card">
        <div class="game-card-icon">⭕❌</div>
        <div class="game-card-badge">Sẵn sàng chơi</div>
        <h2 class="game-card-title">Cờ Caro (Gomoku)</h2>
        <p class="game-card-desc">Bàn cờ 15x15, luật 5 ô tự do. Chơi 2 người hoặc đấu trí với AI Bot 3 cấp độ.</p>
      </a>
    </div>
  </main>

  <script src="shared/js/audio.js"></script>
  <script src="shared/js/navigation.js"></script>
  <script>
    if (window.ViggaNav) window.ViggaNav.init();
  </script>
</body>
</html>
